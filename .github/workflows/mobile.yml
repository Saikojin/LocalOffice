name: Build Mobile Packages (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Build Android APK
        run: npx tauri android build --apk
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ndk-path }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localoffice-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
