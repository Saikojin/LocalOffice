[package]
name = "localoffice"
version = "0.1.0"
description = "LocalOffice - Standalone modern local-first office suite"
authors = ["Saikojin"]
license = "MIT"
edition = "2021"

[lib]
name = "localoffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
